name: Timeout Example

on: [push]
concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true # it will cancel the running one, pickup new one
jobs:
  test-timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 5    #“Stop the job if it runs more than 5 minutes”
 
    steps:
      - name: Start job
        run: echo "This job will timeout if it runs longer than 5 minutes."

      - name: Simulate long running task
        run: |
          echo "Sleeping for 10 minutes..."
          sleep 600    


# # What will happen when you run it?
# | Time        | What happens                |
# | ----------- | --------------------------- |
# | 0–5 min     | job runs normally           |
# | 5 min       | GitHub kills job ❌          |
# | after 5 min | job marked FAILED (timeout) |
          